services:
  - type: web
    name: lyric-goat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 240 --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: LYRIC_GOAT_WRITER
        value: openai
      - key: OPENAI_GENERATION_MODEL
        value: gpt-6-luna
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: LYRIC_GOAT_TRANSCRIPTION_MODE
        value: timed
      - key: MELODY_NOTE_PROVIDER
        value: pyin
      - key: LYRIC_GOAT_AUDIO_LISTENER
        value: auto
      - key: OPENAI_LISTENING_MODEL
        value: gpt-audio-1.5
