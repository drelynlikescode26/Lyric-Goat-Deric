[build]
  [build.environment]
  PYTHON_VERSION = "3.11.9"

[deploy]
  startCommand = "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2"

[[services]]
  type = "web"
  name = "lyric-goat"
  envVars = [
    { key = "ANTHROPIC_API_KEY", generateValue = false },
    { key = "OPENAI_API_KEY", generateValue = false },
    { key = "FLASK_SECRET_KEY", generateValue = true }
  ]
